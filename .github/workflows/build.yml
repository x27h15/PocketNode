name: Build and Release PocketNode

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build setL for ARMv7 (Linux)
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o bin/setL-linux-armv7 ./cmd/setL

      - name: Build Installer (Windows AMD64)
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o bin/pocketnode-installer-windows-amd64.exe ./cmd/installer

      - name: Build Installer (Linux AMD64)
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/pocketnode-installer-linux-amd64 ./cmd/installer

      - name: Build Installer (macOS ARM64)
        run: |
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o bin/pocketnode-installer-darwin-arm64 ./cmd/installer

      - name: Build Installer (macOS Intel AMD64)
        run: |
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o bin/pocketnode-installer-darwin-amd64 ./cmd/installer

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pocketnode-binaries
          path: bin/ # Указываем папку целиком, чтобы сохранить структуру

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: pocketnode-binaries
          path: release-assets # Скачиваем в отдельную чистую папку

      - name: Package Assets
        run: |
          if [ -f "assets/recovery.tar" ]; then
            cp assets/recovery.tar release-assets/
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/* # Загружаем всё содержимое этой папки в релиз
          generate_release_notes: true
